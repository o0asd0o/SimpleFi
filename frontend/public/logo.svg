
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" /> <!-- Pink 500 -->
      <stop offset="100%" stop-color="#8b5cf6" /> <!-- Purple 500 -->
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#120F1C" />
  <g transform="translate(126, 126)" filter="url(#glow)">
    <!-- Stylized minimalist 'S' -->
    <path 
      d="M210 50 C210 50, 60 50, 60 100 C60 150, 190 150, 190 200 C190 250, 50 250, 50 250"
      fill="none" 
      stroke="url(#primaryGrad)" 
      stroke-width="48" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <circle cx="210" cy="250" r="24" fill="#60a5fa" /> <!-- Blue 400 dot -->
  </g>
</svg>
